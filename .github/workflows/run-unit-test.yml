name: Run unit tests of /feature branches

on: 
  push:
    branches:
      'feature/*'

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout REPO
        uses: actions/checkout@v3.3.0

      - name: Run Tests
        run: python -m unittest 'Project 5/TodoApp/test'

